---
RecipeFormatVersion: '2020-01-25'
ComponentName: com.iotconnect.humidity
ComponentVersion: 0.0.1
ComponentDescription: My component.
ComponentPublisher: 
ComponentConfiguration:
  DefaultConfiguration:
    InferenceInterval: 12
    accessControl:
      aws.greengrass.ipc.pubsub:
        com.iotconnect.humidity:pubsub:1:
          policyDescription: Allows access to subscribe to mypi/button.
          operations:
          - aws.greengrass#PublishToTopic
          resources:
          - "*"
Manifests:
- Platform:
    os: linux
  Lifecycle:
    Install:
      RequiresPrivilege: true
      script: |-
        python3 -m pip install --user awsiotsdk
        python3 -m pip install --user scikit-learn
    Run:
      RequiresPrivilege: true
      script: python3 -u {artifacts:path}/iotconnect_Humidity.py '{configuration:/InferenceInterval}'
  Artifacts:
  - Uri: s3://root-891377397491/529a9126-591a-47fd-a1fe-14e30df3854c/gg-artifacts/iotconnect_Humidity.py
